default:
  image: alpine:latest

stages:
  - test
  - build
  - deploy

run_unit_tests:
  stage: test
  script:
    - echo "Executing automated unit tests..."
    - echo "Checking system syntax and code sanity..."
    - echo "All tests passed successfully!"

build_application:
  stage: build
  script:
    - echo "Compiling application binaries..."
    - mkdir -p dist/
    - echo "Release build v1.0.0 artifact" > dist/app.bin
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy_to_staging:
  stage: deploy
  script:
    - echo "Deploying artifact to staging environment..."
    - cat dist/app.bin
  only:
    - main
